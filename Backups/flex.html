<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#061018" />
    <title>Neon Outpost - Enemy Showroom</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <style>
      *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030a10;color:#d8f8f4;font-family:Arial,sans-serif}#showroom{position:fixed;inset:0}canvas{display:block}
      .showroom-ui{position:fixed;z-index:2;inset:18px 20px auto 20px;min-height:42px;pointer-events:none}
      .title{position:absolute;top:0;left:0;padding:13px 17px;background:linear-gradient(110deg,rgba(5,20,29,.94),rgba(6,29,35,.72));border-left:3px solid #42e8d1;box-shadow:0 0 28px rgba(34,222,204,.12);letter-spacing:.13em;text-transform:uppercase}.title strong{display:block;font-size:18px}.title span{display:block;margin-top:4px;color:#67a9a5;font:700 10px monospace}
      .controls{display:flex;gap:7px;pointer-events:auto;align-items:stretch}.controls button,.controls select,.controls .play-game{border:1px solid #29666d;background:rgba(5,19,28,.94);color:#bcece7;padding:9px 12px;font:700 11px monospace;letter-spacing:.06em}.controls button,.controls .play-game{cursor:pointer}.controls button:hover,.controls select:focus{border-color:#52efd8;color:white;background:#0a3037;outline:none}.controls select{min-width:220px;cursor:pointer}.controls .show-button{border-color:#2cbca9;color:#77f5df}.controls .play-game{display:flex;align-items:center;text-decoration:none;border-color:#39e56f;color:#9dffba;background:rgba(20,104,48,.78);box-shadow:inset 0 0 14px rgba(57,229,111,.12)}.controls .play-game:hover{border-color:#8cffad;color:#04150a;background:#55ed82;box-shadow:0 0 20px rgba(57,229,111,.35);outline:none}.enemy-picker{position:absolute;top:0;left:50%;transform:translateX(-50%)}.view-controls{position:absolute;top:0;right:0}
      .help{position:fixed;z-index:2;left:20px;bottom:17px;padding:8px 12px;background:rgba(3,13,20,.82);border:1px solid rgba(62,174,174,.3);color:#76a6a5;font:700 10px monospace;letter-spacing:.08em;pointer-events:none}
      .animation-controls{position:fixed;z-index:3;right:20px;bottom:17px;max-width:calc(100vw - 560px);display:flex;align-items:center;gap:8px;padding:7px 9px;background:rgba(3,13,20,.88);border-bottom:2px solid #32d7c2;pointer-events:auto}.animation-controls[hidden]{display:none}.animation-controls>span{color:#67a9a5;font:800 9px monospace;letter-spacing:.12em;white-space:nowrap}.animation-buttons{display:flex;gap:5px}.animation-buttons button{border:1px solid #285760;background:#071821;color:#addbd7;padding:8px 10px;cursor:pointer;font:800 10px monospace;letter-spacing:.05em}.animation-buttons button:hover,.animation-buttons button.active{color:#fff;border-color:#43e4ce;background:#0b343a}.animation-buttons button.skill{border-color:#a47232;color:#ffc86f}.animation-buttons button.reset{border-color:#53636a;color:#9db0b4}
      @media(max-width:1100px){.title span{display:none}.title strong{font-size:14px}.animation-controls{max-width:calc(100vw - 300px);overflow-x:auto}.animation-controls>span{display:none}.animation-buttons button{padding:7px 8px;font-size:8px;white-space:nowrap}}
      @media(max-width:900px){.showroom-ui{inset:8px 8px auto;min-height:78px}.title{padding:8px 10px}.title strong{font-size:11px}.controls{gap:4px}.controls button,.controls select,.controls .play-game{padding:7px 8px;font-size:8px}.controls select{min-width:135px;max-width:170px}.view-controls{top:39px;right:0}.animation-controls{right:8px;bottom:7px;max-width:calc(100vw - 16px)}.help{display:none}}
    </style>
    <script type="importmap">
      {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"}}
    </script>
  </head>
  <body>
    <main id="showroom" aria-label="Static 3D enemy showroom"></main>
    <header class="showroom-ui">
      <div class="title"><strong>Enemy Design Showroom</strong><span>20 STATIC UNITS // 5.25 METER SPACING</span></div>
      <nav class="controls enemy-picker" aria-label="Enemy selection">
        <select id="enemy-filter" aria-label="Choose an enemy"></select>
        <button id="show-enemy" class="show-button" type="button">SHOW</button>
      </nav>
      <nav class="controls view-controls" aria-label="Camera views">
        <a class="play-game" href="./index.html">PLAY GAME</a>
        <button id="front-view" type="button">FRONT</button>
        <button id="top-view" type="button">TOP</button>
        <button id="reset-view" type="button">RESET</button>
        <button id="background-toggle" type="button" aria-pressed="false">ENV: BLACK</button>
      </nav>
      <section id="animation-controls" class="animation-controls" hidden aria-label="Enemy animation preview">
        <span>ANIMATION // TARGET 10M</span><div id="animation-buttons" class="animation-buttons"></div>
      </section>
    </header>
    <div class="help">WASD: MOVE&nbsp;&nbsp; Q: UP&nbsp;&nbsp; E: DOWN&nbsp;&nbsp; DRAG: LOOK&nbsp;&nbsp; RIGHT DRAG: PAN&nbsp;&nbsp; WHEEL: ZOOM</div>
    <script type="module" src="./flex.js"></script>
  </body>
</html>
